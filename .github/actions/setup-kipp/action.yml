name: Setup Kipp
description: Install Kipp Managed Services and configure an isolated Pi environment for repository automation

inputs:
  kipp-version:
    description: 'Exact Kipp version or `latest`. Ignored when `package-path` is set.'
    required: true
  package-path:
    description: 'Path to a local Kipp package, absolute or relative to `GITHUB_WORKSPACE`. When set, the action skips downloading Kipp from the registry and ignores `kipp-version`.'
    required: false
    default: ''
  ai-provider:
    description: 'AI provider to configure: `openai-compatible` or `azure-foundry`.'
    required: true
  ai-model:
    description: 'Model or deployment used for automation work.'
    required: true
  ai-api-key:
    description: 'API key for the provider endpoint. Required for `openai-compatible`.'
    required: false
    default: ''
  ai-base-url:
    description: 'Base URL of the OpenAI-compatible endpoint. Required for `openai-compatible`.'
    required: false
    default: ''
  azure-client-id:
    description: 'Microsoft Entra application or managed identity client ID. Required for `azure-foundry`.'
    required: false
    default: ''
  azure-tenant-id:
    description: 'Microsoft Entra tenant ID. Required for `azure-foundry`.'
    required: false
    default: ''
  azure-subscription-id:
    description: 'Azure subscription ID. Required for `azure-foundry`.'
    required: false
    default: ''
  azure-foundry-endpoint:
    description: 'Azure AI Foundry endpoint used to invoke the configured deployments. Required for `azure-foundry`.'
    required: false
    default: ''
  node-version:
    description: 'Node.js version used by Pi and automation commands. Default: `24.x`.'
    required: false
    default: 24.x

outputs:
  kipp-version:
    description: 'Exact version read from the selected Kipp package.'
    value: ${{ steps.download.outputs.kipp-version }}
  package-path:
    description: 'Absolute path to the selected Kipp package root.'
    value: ${{ steps.download.outputs.package-path }}
  runtime-path:
    description: 'Absolute path to the Kipp automation runtime entry point.'
    value: ${{ steps.runtime.outputs.runtime-path }}
  pi-version:
    description: 'Exact version of the installed Pi package.'
    value: ${{ steps.runtime.outputs.pi-version }}
  agent-dir:
    description: 'Absolute path to the isolated Pi agent directory.'
    value: ${{ steps.pi-env.outputs.agent-dir }}
  session-dir:
    description: 'Absolute path to the directory containing Pi session transcripts.'
    value: ${{ steps.pi-env.outputs.session-dir }}

runs:
  using: "composite"

  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        KIPP_VERSION: ${{ inputs.kipp-version }}
        PACKAGE_PATH_INPUT: ${{ inputs.package-path }}
        AI_PROVIDER: ${{ inputs.ai-provider }}
        AI_MODEL: ${{ inputs.ai-model }}
        AI_API_KEY: ${{ inputs.ai-api-key }}
        AI_BASE_URL: ${{ inputs.ai-base-url }}
        AZURE_CLIENT_ID: ${{ inputs.azure-client-id }}
        AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
        AZURE_FOUNDRY_ENDPOINT: ${{ inputs.azure-foundry-endpoint }}
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail

        # Reject line-breaking input before emitting any workflow command or
        # diagnostic containing caller-controlled data.
        reject_line_breaks() {
          case "$2" in
            *$'\r'*|*$'\n'*)
              printf '::error::%s must not contain a carriage return or newline.\n' "$1"
              exit 1
              ;;
          esac
        }

        reject_line_breaks "kipp-version" "$KIPP_VERSION"
        reject_line_breaks "package-path" "$PACKAGE_PATH_INPUT"
        reject_line_breaks "ai-provider" "$AI_PROVIDER"
        reject_line_breaks "ai-model" "$AI_MODEL"
        reject_line_breaks "ai-api-key" "$AI_API_KEY"
        reject_line_breaks "ai-base-url" "$AI_BASE_URL"
        reject_line_breaks "azure-client-id" "$AZURE_CLIENT_ID"
        reject_line_breaks "azure-tenant-id" "$AZURE_TENANT_ID"
        reject_line_breaks "azure-subscription-id" "$AZURE_SUBSCRIPTION_ID"
        reject_line_breaks "azure-foundry-endpoint" "$AZURE_FOUNDRY_ENDPOINT"
        reject_line_breaks "node-version" "$NODE_VERSION"

        # Explicitly mask the key in case the caller passed a literal value instead of a GitHub secret.
        if [ -n "$AI_API_KEY" ]; then
          # Workflow commands percent-decode their payload, so escape percent
          # signs to preserve the key's literal value when registering the mask.
          MASK_VALUE="${AI_API_KEY//'%'/'%25'}"
          printf '::add-mask::%s\n' "$MASK_VALUE"
          unset MASK_VALUE
        fi

        EXACT_VERSION='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
        GUID='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        HTTPS_URL='^https://[A-Za-z0-9._-]+(:[0-9]+)?(/[^[:space:]]*)?$'

        fail() {
          echo "::error::$1"
          exit 1
        }

        require() {
          [ -n "$2" ] || fail "$1 is required when ai-provider is '$AI_PROVIDER'."
        }

        case "$AI_PROVIDER" in
          openai-compatible | azure-foundry) ;;
          *) fail "Unsupported ai-provider '$AI_PROVIDER'. Supported providers are: openai-compatible, azure-foundry." ;;
        esac

        PACKAGE_PATH=''
        if [ -n "$PACKAGE_PATH_INPUT" ]; then
          case "$PACKAGE_PATH_INPUT" in
            /*) PACKAGE_PATH="$PACKAGE_PATH_INPUT" ;;
            *) PACKAGE_PATH="$GITHUB_WORKSPACE/$PACKAGE_PATH_INPUT" ;;
          esac
          [ -d "$PACKAGE_PATH" ] || fail "package-path '$PACKAGE_PATH_INPUT' is not a directory at $PACKAGE_PATH."
          [ -f "$PACKAGE_PATH/package.json" ] || fail "package-path '$PACKAGE_PATH_INPUT' has no package.json at $PACKAGE_PATH/package.json."
        fi

        # Registry installs accept an exact version or `latest`. A local package supplies its own
        # version through package.json, so kipp-version is ignored when package-path is set.
        if [ -z "$PACKAGE_PATH" ] && [ "$KIPP_VERSION" != "latest" ]; then
          [[ "$KIPP_VERSION" =~ $EXACT_VERSION ]] || fail "kipp-version must be an exact version such as 1.2.3, or the literal 'latest', received '$KIPP_VERSION'."
        fi
        [ -n "$AI_MODEL" ] || fail "ai-model is required."

        case "$AI_PROVIDER" in
          openai-compatible)
            require "ai-api-key" "$AI_API_KEY"
            require "ai-base-url" "$AI_BASE_URL"
            [[ "$AI_BASE_URL" =~ $HTTPS_URL ]] || fail "ai-base-url must be an https URL, received '$AI_BASE_URL'."
            ;;
          azure-foundry)
            require "azure-client-id" "$AZURE_CLIENT_ID"
            require "azure-tenant-id" "$AZURE_TENANT_ID"
            require "azure-subscription-id" "$AZURE_SUBSCRIPTION_ID"
            require "azure-foundry-endpoint" "$AZURE_FOUNDRY_ENDPOINT"
            for pair in "azure-client-id=$AZURE_CLIENT_ID" "azure-tenant-id=$AZURE_TENANT_ID" "azure-subscription-id=$AZURE_SUBSCRIPTION_ID"; do
              name="${pair%%=*}"
              value="${pair#*=}"
              [[ "$value" =~ $GUID ]] || fail "$name must be a GUID, received '$value'."
            done
            [[ "$AZURE_FOUNDRY_ENDPOINT" =~ $HTTPS_URL ]] || fail "azure-foundry-endpoint must be an https URL, received '$AZURE_FOUNDRY_ENDPOINT'."
            ;;
        esac

        echo "package-path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

        echo "Provider '$AI_PROVIDER' selected with model '$AI_MODEL'."

    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false # There is no project lockfile to use as a cache key.

    - name: Create isolated Pi environment
      id: pi-env
      shell: bash
      run: |
        set -euo pipefail

        AGENT_DIR="$RUNNER_TEMP/kipp-pi-agent"
        SESSION_DIR="$RUNNER_TEMP/kipp-pi-sessions"

        mkdir -p "$AGENT_DIR" "$SESSION_DIR"
        chmod 700 "$AGENT_DIR" "$SESSION_DIR"

        # Give this job its own Pi directory so credentials or settings already
        # on the runner cannot change its provider configuration. Offline mode
        # also disables Pi's automatic version check.
        {
          echo "PI_CODING_AGENT_DIR=$AGENT_DIR"
          echo "PI_OFFLINE=1"
          echo "PI_TELEMETRY=0"
          echo "KIPP_SESSION_DIR=$SESSION_DIR"
        } >> "$GITHUB_ENV"

        {
          echo "agent-dir=$AGENT_DIR"
          echo "session-dir=$SESSION_DIR"
        } >> "$GITHUB_OUTPUT"

    # Export only non-secret provider settings.
    # The API key is passed directly to the steps that need it and is never written to GITHUB_ENV.
    - name: Export provider configuration
      shell: bash
      env:
        AI_PROVIDER: ${{ inputs.ai-provider }}
        AI_MODEL: ${{ inputs.ai-model }}
        AI_BASE_URL: ${{ inputs.ai-base-url }}
        AZURE_CLIENT_ID: ${{ inputs.azure-client-id }}
        AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
        AZURE_FOUNDRY_ENDPOINT: ${{ inputs.azure-foundry-endpoint }}
      run: |
        set -euo pipefail

        {
          echo "KIPP_AI_PROVIDER=$AI_PROVIDER"
          echo "KIPP_AI_MODEL=$AI_MODEL"
        } >> "$GITHUB_ENV"

        [ -z "$AI_BASE_URL" ] || echo "KIPP_AI_BASE_URL=$AI_BASE_URL" >> "$GITHUB_ENV"
        [ -z "$AZURE_CLIENT_ID" ] || echo "KIPP_AZURE_CLIENT_ID=$AZURE_CLIENT_ID" >> "$GITHUB_ENV"
        [ -z "$AZURE_TENANT_ID" ] || echo "KIPP_AZURE_TENANT_ID=$AZURE_TENANT_ID" >> "$GITHUB_ENV"
        [ -z "$AZURE_SUBSCRIPTION_ID" ] || echo "KIPP_AZURE_SUBSCRIPTION_ID=$AZURE_SUBSCRIPTION_ID" >> "$GITHUB_ENV"
        [ -z "$AZURE_FOUNDRY_ENDPOINT" ] || echo "KIPP_AZURE_FOUNDRY_ENDPOINT=$AZURE_FOUNDRY_ENDPOINT" >> "$GITHUB_ENV"

    - name: Download Kipp
      id: download
      shell: bash
      env:
        REGISTRY_URL: https://npm.makerx.tech/
        PACKAGE_SCOPE: '@makerx-trusted-access'
        PACKAGE_NAME: '@makerx-trusted-access/kipp'
        KIPP_VERSION: ${{ inputs.kipp-version }}
        PACKAGE_PATH_OVERRIDE: ${{ steps.validate.outputs.package-path }}
      run: | # zizmor: ignore[adhoc-packages]
        set -euo pipefail

        if [ -n "$PACKAGE_PATH_OVERRIDE" ]; then
          LOCAL_MANIFEST="$PACKAGE_PATH_OVERRIDE/package.json"
          EXACT_VERSION='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

          fail_manifest() {
            echo "::error::The local Kipp package at $PACKAGE_PATH_OVERRIDE $1."
            exit 1
          }

          # Normalize invalid field types so validation below reports consistent errors.
          read_manifest_field() {
            FIELD="$1" MANIFEST_PATH="$LOCAL_MANIFEST" node -e '
              const manifest = require(process.env.MANIFEST_PATH);
              const value = manifest[process.env.FIELD];
              process.stdout.write(typeof value === "string" ? value : "");
            '
          }

          LOCAL_NAME="$(read_manifest_field name)"
          LOCAL_VERSION="$(read_manifest_field version)"

          # Validate caller-controlled metadata before writing it to $GITHUB_OUTPUT or including it
          # in a workflow command. The exact-version check also rejects line breaks.
          [ -n "$LOCAL_NAME" ] || fail_manifest "declares no package name"
          case "$LOCAL_NAME" in
            *$'\r'*|*$'\n'*) fail_manifest "declares a package name containing a carriage return or newline" ;;
          esac
          [[ "$LOCAL_VERSION" =~ $EXACT_VERSION ]] ||
            fail_manifest "must declare an exact version such as 1.2.3, received '$LOCAL_VERSION'"

          {
            echo "package-path=$PACKAGE_PATH_OVERRIDE"
            echo "kipp-version=$LOCAL_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Using the local Kipp package $LOCAL_NAME@$LOCAL_VERSION at $PACKAGE_PATH_OVERRIDE. Nothing was installed from $REGISTRY_URL."
          exit 0
        fi

        NPMRC="$RUNNER_TEMP/kipp-trusted-access.npmrc"
        trap 'rm -f "$NPMRC"' EXIT

        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::No OIDC token endpoint is available. Grant the job 'id-token: write' permission."
          exit 1
        fi

        AUDIENCE="${REGISTRY_URL%/}"
        HOST="${AUDIENCE#https://}"
        INSTALL_ROOT="$RUNNER_TEMP/kipp-package"

        # Install under a separate private package so npm does not use the
        # checked-out repository's package metadata or lockfile.
        mkdir -p "$INSTALL_ROOT"
        printf '{ "name": "kipp-managed-services-install", "version": "0.0.0", "private": true }\n' > "$INSTALL_ROOT/package.json"

        if ! TOKEN_RESPONSE=$(curl -sS --fail --max-time 30 \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE"); then
          echo "::error::Failed to request an OIDC token for $AUDIENCE."
          exit 1
        fi

        TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | jq -r '.value // empty')
        unset TOKEN_RESPONSE
        if [ -z "$TOKEN" ]; then
          echo "::error::The OIDC token response for $AUDIENCE contained no token."
          exit 1
        fi
        echo "::add-mask::$TOKEN"

        ( umask 077 && printf '%s:registry=%s\n//%s/:_authToken=%s\n' \
          "$PACKAGE_SCOPE" "$REGISTRY_URL" "$HOST" "$TOKEN" > "$NPMRC" )
        export NPM_CONFIG_USERCONFIG="$NPMRC"

        INSTALL_VERSION="$KIPP_VERSION"
        if [ "$INSTALL_VERSION" = "latest" ]; then
          INSTALL_VERSION=$(npm view "$PACKAGE_NAME" version --registry "$REGISTRY_URL") || INSTALL_VERSION=""
          if [[ ! "$INSTALL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Could not resolve $PACKAGE_NAME@latest to an exact version from $REGISTRY_URL."
            exit 1
          fi
          echo "::notice::Resolved $PACKAGE_NAME@latest to $INSTALL_VERSION"
        fi

        npm install --prefix "$INSTALL_ROOT" --no-save --ignore-scripts --no-audit --no-fund "$PACKAGE_NAME@$INSTALL_VERSION"

        rm -f "$NPMRC"
        unset NPM_CONFIG_USERCONFIG

        PACKAGE_PATH="$INSTALL_ROOT/node_modules/$PACKAGE_NAME"
        if [ ! -f "$PACKAGE_PATH/package.json" ]; then
          echo "::error::$PACKAGE_NAME@$INSTALL_VERSION did not install to $PACKAGE_PATH."
          exit 1
        fi

        RESOLVED_VERSION=$(MANIFEST_PATH="$PACKAGE_PATH/package.json" node -e 'process.stdout.write(String(require(process.env.MANIFEST_PATH).version))')

        {
          echo "package-path=$PACKAGE_PATH"
          echo "kipp-version=$RESOLVED_VERSION"
        } >> "$GITHUB_OUTPUT"

        echo "::notice::Installed $PACKAGE_NAME@$RESOLVED_VERSION from $REGISTRY_URL"

    - name: Resolve Kipp runtime
      id: runtime
      shell: bash
      env:
        PACKAGE_PATH: ${{ steps.download.outputs.package-path }}
      run: |
        set -euo pipefail

        MANIFEST="$PACKAGE_PATH/package.json"

        read_field() {
          FIELD="$1" MANIFEST_PATH="$MANIFEST" node -e '
            const manifest = require(process.env.MANIFEST_PATH);
            const value = (manifest.kipp || {})[process.env.FIELD];
            process.stdout.write(typeof value === "string" ? value : "");
          '
        }

        PI_VERSION="$(read_field supportedPiVersion)"
        RUNTIME_RELATIVE="$(read_field runtime)"

        if [ -z "$PI_VERSION" ]; then
          echo "::error::The installed Kipp package does not declare 'kipp.supportedPiVersion'. Upgrade kipp-version to a release that ships the Managed Services manifest."
          exit 1
        fi

        if [[ ! "$PI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::The resolved Pi version '$PI_VERSION' is not an exact version."
          exit 1
        fi

        if [ -z "$RUNTIME_RELATIVE" ]; then
          echo "::error::The installed Kipp package does not declare 'kipp.runtime'. Upgrade kipp-version to a release that ships the Managed Services automation runtime."
          exit 1
        fi

        RUNTIME_PATH="$PACKAGE_PATH/$RUNTIME_RELATIVE"
        if [ ! -f "$RUNTIME_PATH" ]; then
          echo "::error::The Kipp package declares 'kipp.runtime' as '$RUNTIME_RELATIVE' but no file exists at $RUNTIME_PATH."
          exit 1
        fi

        {
          echo "pi-version=$PI_VERSION"
          echo "runtime-path=$RUNTIME_PATH"
        } >> "$GITHUB_OUTPUT"

        {
          echo "KIPP_PACKAGE_PATH=$PACKAGE_PATH"
          echo "KIPP_RUNTIME_PATH=$RUNTIME_PATH"
        } >> "$GITHUB_ENV"

        echo "Resolved Pi $PI_VERSION and runtime entry point $RUNTIME_PATH."

    # Pi's find and grep tools look for fd and rg in the agent directory's bin before PATH.
    - name: Install search tools
      shell: bash
      env:
        PACKAGE_PATH: ${{ steps.download.outputs.package-path }}
        AGENT_DIR: ${{ steps.pi-env.outputs.agent-dir }}
      run: |
        set -euo pipefail

        MANIFEST="$PACKAGE_PATH/package.json"
        EXACT_VERSION='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        SHA256='^[0-9a-f]{64}$'
        PLATFORMS=(linux-x64 linux-arm64)

        fail() {
          echo "::error::$1"
          exit 1
        }

        tools_kind() {
          MANIFEST_PATH="$MANIFEST" node -e '
            const isObject = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
            let value = (require(process.env.MANIFEST_PATH).kipp || {}).tools;
            for (const key of process.argv.slice(1)) value = isObject(value) ? value[key] : undefined;
            process.stdout.write(value === undefined ? "absent" : isObject(value) ? "object" : "other");
          ' "$@"
        }

        read_tools_field() {
          MANIFEST_PATH="$MANIFEST" node -e '
            let value = (require(process.env.MANIFEST_PATH).kipp || {}).tools;
            for (const key of process.argv.slice(1)) value = value !== null && typeof value === "object" ? value[key] : undefined;
            process.stdout.write(typeof value === "string" ? value : "");
          ' "$@"
        }

        case "$(tools_kind)" in
          absent)
            echo "::notice::The installed Kipp package does not declare 'kipp.tools', so fd and rg were not installed. Upgrade kipp-version to a release that pins them."
            exit 0
            ;;
          other) fail "The installed Kipp package declares 'kipp.tools' but it is not an object." ;;
        esac

        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) RUNNER_PLATFORM=linux-x64 ;;
          Linux/ARM64) RUNNER_PLATFORM=linux-arm64 ;;
          *) RUNNER_PLATFORM='' ;;
        esac

        # Validate every pin before choosing one, so a malformed block fails on any runner.
        # Indexed arrays keep this step working in the bash 3.2 that macOS runners ship.
        TOOLS=(fd rg)
        VERSIONS=()
        URLS=()
        SHAS=()
        for i in "${!TOOLS[@]}"; do
          TOOL="${TOOLS[$i]}"
          case "$TOOL" in
            fd) REPO='sharkdp/fd' ;;
            rg) REPO='BurntSushi/ripgrep' ;;
          esac
          URL_PATTERN="^https://github\.com/$REPO/releases/download/([A-Za-z0-9][A-Za-z0-9._+-]*)/[A-Za-z0-9][A-Za-z0-9._+-]*\.tar\.gz$"

          [ "$(tools_kind "$TOOL")" = object ] || fail "The installed Kipp package does not declare 'kipp.tools.$TOOL' as an object."
          VERSION="$(read_tools_field "$TOOL" version)"
          [[ "$VERSION" =~ $EXACT_VERSION ]] || fail "The installed Kipp package does not declare 'kipp.tools.$TOOL.version' as an exact version."
          VERSIONS[i]="$VERSION"
          [ "$(tools_kind "$TOOL" assets)" = object ] || fail "The installed Kipp package does not declare 'kipp.tools.$TOOL.assets' as an object."

          for PLATFORM in "${PLATFORMS[@]}"; do
            FIELD="kipp.tools.$TOOL.assets.$PLATFORM"
            case "$(tools_kind "$TOOL" assets "$PLATFORM")" in
              absent) continue ;;
              other) fail "The installed Kipp package declares '$FIELD' but it is not an object." ;;
            esac
            URL="$(read_tools_field "$TOOL" assets "$PLATFORM" url)"
            SHA="$(read_tools_field "$TOOL" assets "$PLATFORM" sha256 | tr '[:upper:]' '[:lower:]')"
            [[ "$URL" =~ $URL_PATTERN ]] || fail "The installed Kipp package does not declare '$FIELD.url' as a .tar.gz release download from https://github.com/$REPO."
            TAG="${BASH_REMATCH[1]}"
            [ "$TAG" = "$VERSION" ] || [ "$TAG" = "v$VERSION" ] ||
              fail "The installed Kipp package declares '$FIELD.url' from release $TAG, which does not match version $VERSION."
            [[ "$SHA" =~ $SHA256 ]] || fail "The installed Kipp package does not declare '$FIELD.sha256' as 64 hexadecimal characters."
            if [ "$PLATFORM" = "$RUNNER_PLATFORM" ]; then
              URLS[i]="$URL"
              SHAS[i]="$SHA"
            fi
          done
        done

        if [ -z "$RUNNER_PLATFORM" ]; then
          echo "::notice::setup-kipp installs fd and rg only on Linux X64 and ARM64 runners, so they were not installed on this $RUNNER_OS $RUNNER_ARCH runner."
          exit 0
        fi

        BIN_DIR="$AGENT_DIR/bin"
        WORK_DIR="$(mktemp -d "$RUNNER_TEMP/kipp-search-tools.XXXXXX")"
        trap 'rm -rf "$WORK_DIR"' EXIT
        mkdir -p "$BIN_DIR"

        for i in "${!TOOLS[@]}"; do
          TOOL="${TOOLS[$i]}"
          VERSION="${VERSIONS[$i]}"
          URL="${URLS[$i]:-}"
          SHA="${SHAS[$i]:-}"
          if [ -z "$URL" ]; then
            echo "::notice::The installed Kipp package pins no $RUNNER_PLATFORM asset for $TOOL $VERSION, so $TOOL was not installed."
            continue
          fi
          ARCHIVE="$WORK_DIR/$TOOL.tar.gz"
          EXTRACT_DIR="$WORK_DIR/$TOOL"

          curl -sS --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 120 \
            -o "$ARCHIVE" "$URL" || fail "Failed to download $TOOL $VERSION from $URL."

          ACTUAL_SHA="$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)"
          [ "$ACTUAL_SHA" = "$SHA" ] ||
            fail "The $TOOL $VERSION archive from $URL has SHA-256 $ACTUAL_SHA, but the Kipp package pins $SHA."

          mkdir "$EXTRACT_DIR"
          tar -xzf "$ARCHIVE" -C "$EXTRACT_DIR" --no-same-owner ||
            fail "Failed to extract the $TOOL $VERSION archive from $URL."

          BINARY=''
          MATCHES=0
          while IFS= read -r FOUND; do
            BINARY="$FOUND"
            MATCHES=$((MATCHES + 1))
          done < <(find "$EXTRACT_DIR" -type f -name "$TOOL")
          [ "$MATCHES" -eq 1 ] ||
            fail "The $TOOL $VERSION archive from $URL holds $MATCHES files named $TOOL, expected exactly one."

          install -m 0755 "$BINARY" "$BIN_DIR/$TOOL"
          "$BIN_DIR/$TOOL" --version || fail "The installed $TOOL $VERSION at $BIN_DIR/$TOOL did not run."
          echo "Installed $TOOL $VERSION for $RUNNER_PLATFORM at $BIN_DIR/$TOOL."
        done

    # The Kipp package ships a lockfile for Pi, so Pi's whole dependency tree is pinned.
    - name: Install Pi
      id: pi
      shell: bash
      env:
        PACKAGE_PATH: ${{ steps.download.outputs.package-path }}
        PI_VERSION: ${{ steps.runtime.outputs.pi-version }}
      run: |
        set -euo pipefail

        RELATIVE_PATH='^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'

        fail() {
          echo "::error::$1"
          exit 1
        }

        PI_INSTALL="$(MANIFEST_PATH="$PACKAGE_PATH/package.json" node -e '
          const value = (require(process.env.MANIFEST_PATH).kipp || {}).piInstall;
          process.stdout.write(typeof value === "string" ? value : "");
        ')"

        [ -n "$PI_INSTALL" ] ||
          fail "The installed Kipp package does not declare 'kipp.piInstall'. Use the Kipp release that matches this setup-kipp pin."

        # The pattern also rejects line breaks, so the value is safe to quote in diagnostics below.
        [[ "$PI_INSTALL" =~ $RELATIVE_PATH ]] ||
          fail "The installed Kipp package does not declare 'kipp.piInstall' as a relative path of letters, digits, '.', '_', '-' and '/'."
        case "/$PI_INSTALL/" in
          */./* | */../*) fail "The Kipp package declares 'kipp.piInstall' as '$PI_INSTALL', which does not name a subdirectory of the package." ;;
        esac

        PACKAGE_ROOT="$(cd -P "$PACKAGE_PATH" && pwd)"
        [ -d "$PACKAGE_ROOT/$PI_INSTALL" ] ||
          fail "The Kipp package declares 'kipp.piInstall' as '$PI_INSTALL' but no directory exists at $PACKAGE_ROOT/$PI_INSTALL."
        PI_SOURCE="$(cd -P "$PACKAGE_ROOT/$PI_INSTALL" && pwd)"
        case "$PI_SOURCE/" in
          "$PACKAGE_ROOT"/?*) ;;
          *) fail "The Kipp package declares 'kipp.piInstall' as '$PI_INSTALL', which resolves to $PI_SOURCE, not a subdirectory of the package." ;;
        esac
        for FILE in package.json package-lock.json; do
          if [ ! -f "$PI_SOURCE/$FILE" ] || [ -L "$PI_SOURCE/$FILE" ]; then
            fail "The Kipp package declares 'kipp.piInstall' as '$PI_INSTALL' but $PI_SOURCE/$FILE is not a regular file."
          fi
        done

        PI_ROOT="$(mktemp -d "$RUNNER_TEMP/kipp-pi.XXXXXX")"
        cp "$PI_SOURCE/package.json" "$PI_SOURCE/package-lock.json" "$PI_ROOT/"

        # Kipp has already vetted the locked releases, so a runner's release-age policy must not refuse them.
        npm ci --prefix "$PI_ROOT" --ignore-scripts --no-audit --no-fund --min-release-age=0

        PI_BIN="$PI_ROOT/node_modules/.bin/pi"
        [ -x "$PI_BIN" ] || fail "The Pi lockfile in the Kipp package installed no pi binary at $PI_BIN."
        INSTALLED_VERSION="$("$PI_BIN" --version)" || fail "Pi at $PI_BIN did not run."
        [ "$INSTALLED_VERSION" = "$PI_VERSION" ] ||
          fail "Pi at $PI_BIN reports version '${INSTALLED_VERSION//[$'\r\n']/ }', but the Kipp package declares 'kipp.supportedPiVersion' as $PI_VERSION."

        # PI_BIN comes only from RUNNER_TEMP, mktemp and a literal, never from an input or the
        # manifest, so it cannot inject a line. The braces only keep zizmor's github-env audit quiet.
        {
          echo "KIPP_PI_BIN=$PI_BIN"
        } >> "$GITHUB_ENV"
        echo "pi-bin=$PI_BIN" >> "$GITHUB_OUTPUT"

        echo "Installed Pi $PI_VERSION from the Kipp package's lockfile at $PI_BIN."

    - name: Install Kipp into Pi
      shell: bash
      env:
        PACKAGE_PATH: ${{ steps.download.outputs.package-path }}
        PI_BIN: ${{ steps.pi.outputs.pi-bin }}
      run: |
        set -euo pipefail
        "$PI_BIN" install "$PACKAGE_PATH"
